---
Name: app-talaria-harness
After:
  - '#talaria-logging'
---
# Lower minLevel so info/warning harness buttons reach Talaria.
Talaria\SilverStripe\Config:
  minLevel: debug
  maxBatchSize: 10
  flushIntervalMs: 500
  enableTracing: true
  tracesSampleRate: 1.0
  enableAnalytics: true
  browserReplaysSessionSampleRate: 0
  browserReplaysOnErrorSampleRate: 1.0
